<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: url(#primaryGrad);
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #38bdf8;
      }
      
      /* Subtle Floating / Pulse Animations */
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes floatCard1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatCard2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes floatCard3 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -40; }
      }

      .pulse-bg {
        animation: pulseGlow 6s ease-in-out infinite alternate;
        transform-origin: center;
      }
      .card-1 {
        animation: floatCard1 5s ease-in-out infinite;
      }
      .card-2 {
        animation: floatCard2 6.5s ease-in-out infinite;
      }
      .card-3 {
        animation: floatCard3 5.8s ease-in-out infinite;
      }
      .data-flow {
        stroke-dasharray: 8, 8;
        animation: dashFlow 2s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Animated Background Ambient Glows (Behind all content) -->
  <g class="pulse-bg">
    <circle cx="200" cy="80" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)" />
    <circle cx="1020" cy="180" r="180" fill="#6366f1" opacity="0.15" filter="url(#glow)" />
    <circle cx="600" cy="300" r="160" fill="#a855f7" opacity="0.1" filter="url(#glow)" />
  </g>

  <!-- Background Grid Mesh Patterns -->
  <g opacity="0.15">
    <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300" stroke="#334155" stroke-width="1" />
    <path d="M 120,0 L 120,360 M 240,0 L 240,360 M 360,0 L 360,360 M 480,0 L 480,360 M 600,0 L 600,360 M 720,0 L 720,360 M 840,0 L 840,360 M 960,0 L 960,360 M 1080,0 L 1080,360" stroke="#334155" stroke-width="1" />
  </g>

  <!-- Dynamic Connecting Flows (Kept in Background) -->
  <path class="data-flow" d="M 700 80 C 850 40, 950 140, 1080 90" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4" />
  <path class="data-flow" d="M 720 280 C 850 330, 960 250, 1100 290" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.4" />

  <!-- Dynamic Floating Feature Pills & Cards (Right Side, Clear of Title) -->
  <g class="card-1">
    <g transform="translate(850, 60)">
      <rect width="250" height="56" rx="28" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
      <circle cx="30" cy="28" r="14" fill="#0284c7" opacity="0.4" />
      <text x="30" y="33" font-size="14" text-anchor="middle">☁️</text>
      <text x="58" y="27" font-family="sans-serif" font-weight="700" font-size="13" fill="#f8fafc">Cloud Migration</text>
      <text x="58" y="43" font-family="sans-serif" font-weight="500" font-size="11" fill="#94a3b8">Architecture &amp; Landing Zones</text>
    </g>
  </g>

  <g class="card-2">
    <g transform="translate(880, 145)">
      <rect width="240" height="56" rx="28" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2" opacity="0.9" />
      <circle cx="30" cy="28" r="14" fill="#4f46e5" opacity="0.4" />
      <text x="30" y="33" font-size="14" text-anchor="middle">💰</text>
      <text x="58" y="27" font-family="sans-serif" font-weight="700" font-size="13" fill="#f8fafc">FinOps &amp; Cost Control</text>
      <text x="58" y="43" font-family="sans-serif" font-weight="500" font-size="11" fill="#94a3b8">Waste Elimination &amp; ROI</text>
    </g>
  </g>

  <g class="card-3">
    <g transform="translate(830, 230)">
      <rect width="270" height="56" rx="28" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.2" opacity="0.9" />
      <circle cx="30" cy="28" r="14" fill="#9333ea" opacity="0.4" />
      <text x="30" y="33" font-size="14" text-anchor="middle">🛡️</text>
      <text x="58" y="27" font-family="sans-serif" font-weight="700" font-size="13" fill="#f8fafc">Governance &amp; Security</text>
      <text x="58" y="43" font-family="sans-serif" font-weight="500" font-size="11" fill="#94a3b8">Continuous CSPM &amp; IaC Policy</text>
    </g>
  </g>

  <!-- FOREGROUND: Header Content, Title, and Subtitle (Unobstructed & Dominant) -->
  <g transform="translate(80, 0)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 52)">
      <rect width="265" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
      <circle cx="16" cy="16" r="4" fill="#38bdf8" />
      <text x="28" y="21" class="badge-text">ENTERPRISE CLOUD ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="140" class="title-text">Awesome Cloud Advisory Services</text>

    <!-- Descriptive Subtitle -->
    <text x="0" y="186" class="subtitle-text">Curated Enterprise Consultancies • Migration Frameworks • Open-Source Governance</text>

    <!-- Feature Pillars -->
    <g transform="translate(0, 230)">
      <!-- Pillar 1 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="18" y="26" font-family="sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">🏢 Global Systems Integrators</text>
      </g>
      <!-- Pillar 2 -->
      <g transform="translate(195, 0)">
        <rect width="180" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="18" y="26" font-family="sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">🔓 Open-Source Toolsets</text>
      </g>
      <!-- Pillar 3 -->
      <g transform="translate(390, 0)">
        <rect width="180" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="18" y="26" font-family="sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">📊 FinOps &amp; Assessment</text>
      </g>
    </g>

    <!-- Sub-footer info -->
    <text x="0" y="315" font-family="sans-serif" font-size="13" font-weight="500" fill="#64748b">Verified Pricing • Real-Time Star Benchmarks • Multi-Cloud Governance</text>
  </g>
</svg>
